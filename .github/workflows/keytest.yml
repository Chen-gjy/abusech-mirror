name: key-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
        run: |
          A="$ABUSECH_KEY"
          echo "== 1) old api v1 POST + Auth-Key header:"
          curl -s -m 60 -X POST -H "Auth-Key: $A" -d "query=get_recent" "https://bazaar.abuse.ch/api/v1/" -o /tmp/r1 -w "HTTP=%{http_code}\n"; head -c 150 /tmp/r1; echo
          echo "== 2) old api v1 POST key in body:"
          curl -s -m 60 -X POST -d "query=get_recent&auth_key=$A" "https://bazaar.abuse.ch/api/v1/" -o /tmp/r2 -w "HTTP=%{http_code}\n"; head -c 150 /tmp/r2; echo
          echo "== 3) mb-api recent.csv:"
          curl -s -m 60 "https://mb-api.abuse.ch/v2/files/exports/$A/recent.csv" -o /tmp/r3 -w "HTTP=%{http_code}\n"; head -c 150 /tmp/r3; echo
          echo "== 4) bazaar export csv online + Auth-Key header:"
          curl -s -m 60 -H "Auth-Key: $A" "https://bazaar.abuse.ch/export/csv/online/" -o /tmp/r4 -w "HTTP=%{http_code}\n"; head -c 150 /tmp/r4; echo
          echo "== key prefix: ${A:0:8} (len=${#A})"
